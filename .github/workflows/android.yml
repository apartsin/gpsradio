name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly live smoke test (runs only if the OPENAI_API_KEY secret exists)

permissions:
  contents: write

# One run per branch at a time; a newer push supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue instead of cancelling, so tagged live-test runs always complete.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest runners ship the Android SDK (ANDROID_HOME is preset).
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test --no-daemon

      - name: Android unit + UI tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        env:
          # Owner's choice: ship the repo secret as the app's default key (scrambled in BuildConfig).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gpsradio-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Every push gets its own versioned (pre)release, v0.5.<run>, kept alongside the tested "latest".
      # "latest" only moves after all tests pass (see the promote job), so it stays usable while the next
      # build is being made and tested.
      - name: Publish versioned build
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/android-app-mvp')
        # A GitHub API hiccup here must not fail the build: promote falls back to the build artifact.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.5.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          cp app/build/outputs/apk/debug/app-debug.apk "gpsradio-${VERSION}.apk"
          SUBJECT="$(git log -1 --pretty=%s)"
          NOTES="GPS Radio ${VERSION}, built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}: ${SUBJECT}

          Testing build: emulator tests are still running. The tested build is always at https://github.com/apartsin/gpsradio/releases/download/latest/gpsradio.apk"
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 10)); done; return 1; }
          gh release view "$TAG" >/dev/null 2>&1 || retry gh release create "$TAG" --prerelease --title "GPS Radio ${VERSION} (testing)" --notes "$NOTES" --target "$GITHUB_SHA"
          retry gh release upload "$TAG" "gpsradio-${VERSION}.apk" --clobber

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

  emulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End-to-end tests on emulator (fake OpenAI/Wikipedia/OSM, no API key)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon || { find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} \; ; adb logcat -d -t 400 '*:W' ; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: app/build/reports/androidTests/

  # Moves "latest" to this build once unit, UI and emulator tests all passed; the build it replaces
  # stays available as "previous". Older versioned builds beyond the newest 15 are pruned.
  promote:
    needs: [build, emulator-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/android-app-mvp')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The APK built (and tested) in this run; doesn't depend on the versioned release existing.
      - uses: actions/download-artifact@v4
        with:
          name: gpsradio-debug-apk
          path: artifact

      - name: Promote to latest (keep the old one as previous)
        run: |
          VERSION="0.5.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 10)); done; return 1; }
          cp artifact/app-debug.apk "gpsradio-${VERSION}.apk"
          cp "gpsradio-${VERSION}.apk" gpsradio.apk
          # Make sure the versioned release exists (the build job's publish step may have hit a GitHub hiccup).
          gh release view "$TAG" >/dev/null 2>&1 || retry gh release create "$TAG" --title "GPS Radio ${VERSION}" --notes "GPS Radio ${VERSION} (${GITHUB_SHA::7})" --target "$GITHUB_SHA"
          # The build job usually uploaded it already (same artifact); re-uploading can fail with 422 "already exists".
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "gpsradio-${VERSION}.apk" \
            || retry gh release upload "$TAG" "gpsradio-${VERSION}.apk" --clobber
          echo "$VERSION" > version.txt
          OLD=""
          if gh release view latest >/dev/null 2>&1; then
            gh release download latest -p version.txt -O old-version.txt 2>/dev/null && OLD="$(cat old-version.txt)"
            if [ "$OLD" != "$VERSION" ] && gh release download latest -p gpsradio.apk -O previous.apk 2>/dev/null; then
              mkdir -p prev && mv previous.apk prev/gpsradio.apk && echo "${OLD:-unknown}" > prev/version.txt
              gh release view previous >/dev/null 2>&1 || gh release create previous --title "GPS Radio – previous tested build" --notes "The tested build before latest." --target "$GITHUB_SHA"
              gh release upload previous prev/gpsradio.apk prev/version.txt --clobber
              gh release edit previous --notes "GPS Radio ${OLD:-unknown}: the tested build before latest. Installs over any other GPS Radio build (settings are kept)."
            fi
          else
            gh release create latest --title "GPS Radio – latest tested build" --notes "Latest tested build." --target "$GITHUB_SHA"
          fi
          # Self-update manifest the app polls (spec B §36): version, checksum, what changed.
          SUBJECT="$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}" --jq '.commit.message' | head -n1)"
          jq -n --arg v "$VERSION" --argjson b "$GITHUB_RUN_NUMBER" \
            --arg apk "https://github.com/${GH_REPO}/releases/download/${TAG}/gpsradio-${VERSION}.apk" \
            --arg sha "$(sha256sum gpsradio.apk | cut -d' ' -f1)" --argjson size "$(stat -c%s gpsradio.apk)" \
            --arg commit "${GITHUB_SHA::7}" --arg notes "$SUBJECT" \
            '{version:$v, build:$b, apk:$apk, sha256:$sha, size:$size, commit:$commit, notes:$notes}' > update.json
          cat update.json
          retry gh release upload latest gpsradio.apk version.txt update.json --clobber
          gh release edit latest --title "GPS Radio – latest tested build" --notes "GPS Radio ${VERSION} (${GITHUB_SHA::7}), passed unit, UI and emulator tests. Install on Android 8.0+ (allow installs from your browser). Any GPS Radio build installs over any other, forward or back, keeping your settings. Previous tested build: https://github.com/${GH_REPO}/releases/download/previous/gpsradio.apk"
          gh release edit "$TAG" --prerelease=false --title "GPS Radio ${VERSION}"

      - name: Prune old versioned builds (keep 15)
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^v0\.' | tail -n +16 | while read -r t; do
            gh release delete "$t" --cleanup-tag -y || true
          done

  live-smoke:
    # Real OpenAI + Wikipedia + OSM. Costs a few cents; runs on manual dispatch and weekly,
    # on pushes whose commit message contains [smoke], and only with the OPENAI_API_KEY secret (never commit keys).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[smoke]') || contains(github.event.head_commit.message, '[evals]')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Live smoke test + content evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./gradlew :core:test --tests '*LiveSmokeTest' --tests '*LiveEvalTest' --tests '*LiveVoiceToolsTest' --tests '*LiveDriveSimulationTest' --tests '*LiveEventsTest' --no-daemon
